<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physiyoga Visiting Card - Cut Corner</title>
    <!-- Geometric fonts to perfectly match the sleek modern lines of the reference -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Montserrat:wght@500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            /* Matte charcoal black for the dark side */
            --dark-card: #1c1c1c;
            /* Concrete/Warm grey for the light side */
            --light-card: #c4c5c4;
            /* Dark graphite for text on light side */
            --text-dark: #2d2d2d;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            /* Dark presentation background */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
            gap: 2rem;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .card-container {
            display: flex;
            flex-direction: column;
            gap: 3rem;
        }

        .card {
            width: 3.5in;
            height: 2in;
            position: relative;
            box-sizing: border-box;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        /* --- FRONT SIDE (DARK) --- */
        .front {
            background-color: var(--dark-card);
            /* Iconic cut corner on top-right */
            clip-path: polygon(0 0, 85% 0%, 100% 25%, 100% 100%, 0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            /* Very subtle noise texture to mimic the matte un-coated paper in the photo */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" opacity="0.04"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100" height="100" filter="url(%23noise)"/></svg>');
        }

        .logo-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: 2.5px;
            /* Glossy Black Emboss Effect */
            background: linear-gradient(135deg, #444 0%, #111 40%, #050505 60%, #333 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow:
                -1px -1px 1px rgba(255, 255, 255, 0.08),
                1px 1px 2px rgba(0, 0, 0, 1),
                1px 1px 8px rgba(0, 0, 0, 0.6);
            margin-right: -2.5px;
            /* offset tracking */
        }

        /* --- BACK SIDE (LIGHT) --- */
        .back {
            background-color: var(--light-card);
            /* Cut corner on top-left (horizontally flipped from the front) */
            clip-path: polygon(15% 0, 100% 0, 100% 100%, 0 100%, 0 25%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 0.4in;
            /* Same subtle paper texture, slightly more visible on light */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" opacity="0.06"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100" height="100" filter="url(%23noise)"/></svg>');
        }

        .back-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            /* Right-aligns all content */
            text-align: right;
        }

        /* Stark, sterile typography mimicking the reference */
        .name {
            font-size: 0.55rem;
            font-weight: 500;
            color: var(--text-dark);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 1px;
        }

        .title {
            font-size: 0.48rem;
            font-weight: 400;
            color: var(--text-dark);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.8;
            margin-bottom: 0.22in;
        }

        .divider {
            width: 2in;
            /* Line width from image */
            height: 1px;
            background-color: var(--text-dark);
            opacity: 0.8;
            margin-bottom: 0.22in;
            margin-right: 0;
            /* Flush right */
        }

        .contact-row {
            font-size: 0.48rem;
            font-weight: 500;
            color: var(--text-dark);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
            opacity: 0.85;
        }

        @media print {
            body {
                background: white;
                padding: 0;
                gap: 0;
            }

            .card-container {
                gap: 0;
            }

            .card {
                box-shadow: none !important;
                page-break-after: always;
            }

            .no-print {
                display: none;
            }

            .front {
                background-color: #1c1c1c !important;
            }

            .back {
                background-color: #c4c5c4 !important;
            }
        }
    </style>
</head>

<body>

    <div class="no-print"
        style="margin-bottom: 2rem; text-align: center; color: white; font-family: 'Inter', sans-serif;">
        <h1 style="margin: 0 0 10px 0; font-size: 1.5rem; font-weight: 400;">Modern Chamfered Card Layout</h1>
        <p style="margin: 0; opacity: 0.7; font-size: 0.9rem;">Press <strong>Ctrl + P</strong> to print or save as PDF.
        </p>
    </div>

    <div class="card-container">

        <!-- Front Side (Dark with glossy embossed logo) -->
        <div class="card front">
            <div class="logo-text">PHYSIYOGA.</div>
        </div>

        <!-- Back Side (Light textured grey with right-aligned text) -->
        <div class="card back">
            <div class="back-content">
                <div class="name">DR. SWETHA R.M (PT)</div>
                <div class="title">PHYSIOTHERAPIST & FOUNDER</div>

                <div class="divider"></div>

                <div class="contact-row">PHYSIYOGA.IN</div>
                <div class="contact-row">+91 9606044310</div>
            </div>
        </div>

    </div>

</body>

</html>
