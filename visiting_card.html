<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physiyoga Visiting Card</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Bandipura';
            src: url('fonts/ATSBandipura-Bold.woff2') format('woff2');
            font-weight: bold;
            font-style: normal;
        }

        :root {
            --primary: #FF9500;
            --bg-color: #242424;
            --shape-dark: #161616;
            --white: #ffffff;
            --text-grey: #dedede;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
            gap: 2rem;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .card-container {
            display: flex;
            flex-direction: column;
            gap: 3rem;
        }

        .card {
            width: 3.5in;
            height: 2in;
            position: relative;
            box-sizing: border-box;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            background-color: var(--bg-color);
            border-radius: 0.15in;
            overflow: hidden;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
            display: flex;
            background-image:
                radial-gradient(circle at top right, rgba(255, 255, 255, 0.05) 0%, transparent 60%),
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" opacity="0.04"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100" height="100" filter="url(%23noise)"/></svg>');
        }

        /* --- GEOMETRIC SHAPES --- */
        .front-shapes {
            position: absolute;
            left: 0;
            top: 0;
            width: 38%;
            height: 100%;
        }

        .front-yellow {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: var(--primary);
            clip-path: polygon(0 0, 100% 50%, 0 100%);
        }

        .front-dark-wrapper {
            position: absolute;
            left: 20px;
            top: -10%;
            width: 100%;
            height: 120%;
            filter: drop-shadow(-8px 0px 10px rgba(0, 0, 0, 0.7));
        }

        .front-dark {
            width: 100%;
            height: 100%;
            background-color: var(--shape-dark);
            clip-path: polygon(0 0, 100% 50%, 0 100%);
        }

        .back-shapes {
            position: absolute;
            right: 0;
            top: 0;
            width: 38%;
            height: 100%;
            z-index: 1;
        }

        .back-yellow {
            position: absolute;
            right: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: var(--primary);
            clip-path: polygon(100% 0, 0 50%, 100% 100%);
        }

        .back-dark-wrapper {
            position: absolute;
            right: 20px;
            top: -10%;
            width: 100%;
            height: 120%;
            filter: drop-shadow(8px 0px 10px rgba(0, 0, 0, 0.7));
        }

        .back-dark {
            width: 100%;
            height: 100%;
            background-color: var(--shape-dark);
            clip-path: polygon(100% 0, 0 50%, 100% 100%);
        }

        /* --- FRONT SIDE --- */
        .front {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .front-content {
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-left: 10%;
            /* offset slightly because of left shape */
        }

        .logo-mark {
            position: relative;
            width: 32px;
            height: 32px;
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .diamond-ring {
            position: absolute;
            width: 26px;
            height: 26px;
            border: 4px solid var(--primary);
            border-radius: 6px;
            transform: rotate(45deg);
        }

        .inner-chevron {
            width: 8px;
            height: 8px;
            border-left: 3px solid var(--primary);
            border-top: 3px solid var(--primary);
            transform: rotate(45deg) translate(1px, 1px);
            border-radius: 1px;
        }

        .brand-text {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--white);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .brand-subtitle {
            font-family: 'Outfit', sans-serif;
            font-weight: 500;
            font-size: 0.45rem;
            color: var(--text-grey);
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        /* --- BACK SIDE --- */
        .back {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 0.4in;
        }

        .back-content {
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 0.25in;
            width: 60%;
        }

        .name-block {
            display: flex;
            flex-direction: column;
        }

        .name {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--white);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .title {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.42rem;
            color: var(--white);
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .line-divider {
            display: flex;
            height: 2px;
        }

        .line-yellow {
            width: 25px;
            background-color: var(--primary);
        }

        .line-white {
            width: 80px;
            background-color: rgba(255, 255, 255, 0.4);
        }

        .contact-block {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .contact-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.48rem;
            color: var(--white);
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .contact-icon {
            width: 8px;
            height: 8px;
            color: var(--white);
        }

        .kannada-text {
            font-family: 'Bandipura', sans-serif;
            position: absolute;
            bottom: -0.05in;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 1.6rem;
            color: rgba(255, 255, 255, 0.03);
            user-select: none;
            z-index: 0;
        }

        @media print {
            body {
                background: white;
                padding: 0;
                gap: 0;
            }

            .card-container {
                gap: 0;
            }

            .card {
                box-shadow: none !important;
                border: 1px solid #333;
                page-break-after: always;
            }

            .no-print {
                display: none;
            }

            .card {
                background-color: var(--bg-color) !important;
                border-radius: 0.15in !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .front-yellow,
            .back-yellow,
            .line-yellow {
                background-color: #FF9500 !important;
            }

            .front-dark,
            .back-dark {
                background-color: #161616 !important;
            }

            .diamond-ring {
                border-color: #FF9500 !important;
            }

            .inner-chevron {
                border-color: #FF9500 !important;
            }
        }
    </style>
</head>

<body>

    <div class="no-print" style="margin-bottom: 2rem; text-align: center; font-family: 'Inter', sans-serif;">
        <h1 style="margin: 0 0 10px 0; font-size: 1.5rem; color: #333;">Geometric Card Design</h1>
        <p style="margin: 0; color: #666; font-size: 0.9rem;">Press <strong>Ctrl + P</strong> to print or save as PDF.
        </p>
    </div>

    <div class="card-container">

        <!-- Front Side -->
        <div class="card front">
            <!-- Left Side Shapes -->
            <div class="front-shapes">
                <div class="front-yellow"></div>
                <div class="front-dark-wrapper">
                    <div class="front-dark"></div>
                </div>
            </div>

            <div class="front-content">
                <!-- <div class="logo-mark">
                    <div class="diamond-ring"></div>
                    <div class="inner-chevron"></div>
                </div> -->
                <div class="brand-text">PHYSIYOGA</div>
                <div class="brand-subtitle">Movement is Medicine</div>
            </div>
        </div>

        <!-- Back Side -->
        <div class="card back">
            <!-- Right Side Shapes -->
            <div class="back-shapes">
                <div class="back-yellow"></div>
                <div class="back-dark-wrapper">
                    <div class="back-dark"></div>
                </div>
            </div>

            <div class="kannada-text">ಫಿಸಿಯೋಗ</div>

            <div class="back-content">
                <div class="name-block">
                    <div class="name">Dr. Swetha R.M (PT)</div>
                    <div class="title">Musculoskeletal Physiotherapist & Founder</div>
                    <div class="line-divider">
                        <div class="line-yellow"></div>
                        <div class="line-white"></div>
                    </div>
                </div>

                <div class="contact-block">
                    <!-- Website -->
                    <div class="contact-row">
                        <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="2" y1="12" x2="22" y2="12"></line>
                            <path
                                d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z">
                            </path>
                        </svg>
                        <span>www.physiyoga.in</span>
                    </div>
                    <!-- Phone -->
                    <div class="contact-row">
                        <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
                            </path>
                        </svg>
                        <span>+91 9606044310</span>
                    </div>
                    <!-- Email -->
                    <div class="contact-row">
                        <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z">
                            </path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <span>dr.swetha@physiyoga.in</span>
                    </div>
                </div>
            </div>

        </div>

    </div>

</body>

</html>
